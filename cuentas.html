<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUENTAS — DSC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap');

:root {
  --bg:        #0e1628;
  --surface:   #172035;
  --surface2:  #1e2d47;
  --surface3:  #243558;
  --border:    #2d4470;
  --border2:   #3a5585;
  --accent:    #4d8eff;
  --accent2:   #00e0b8;
  --accent3:   #FFD600;
  --purple:    #c4a8ff;
  --pink:      #f472b6;
  --danger:    #ff6b78;
  --text:      #e8f0ff;
  --text-dim:  #8aabcc;
  --text-bright:#ffffff;
  --glow-blue: rgba(26,107,255,0.15);
  --glow-teal: rgba(0,198,162,0.12);
  --glow-purp: rgba(167,139,250,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  min-height:100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  overflow-x: hidden;
}

/* ── FONDO DECORATIVO ── */
.bg-deco {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(26,49,100,0.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,49,100,0.18) 1px, transparent 1px);
  background-size: 36px 36px;
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
}
.orb1 { width:500px; height:500px; top:-150px; right:-100px; background:rgba(26,107,255,0.07); }
.orb2 { width:400px; height:400px; bottom:-100px; left:-80px; background:rgba(0,198,162,0.05); }
.orb3 { width:300px; height:300px; top:40%; left:40%; background:rgba(167,139,250,0.04); }

/* Teléfonos decorativos SVG flotantes */
.phone-deco {
  position: absolute;
  opacity: 0.04;
  pointer-events: none;
}
.phone-deco svg { display: block; }

/* ── LAYOUT ── */
.wrapper {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

/* ── HEADER ── */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 32px;
  gap: 16px;
  flex-wrap: wrap;
}

.header-left {}

.header-eyebrow {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.header-title {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--text-bright);
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-title .accent-bar {
  width: 4px;
  height: 36px;
  background: linear-gradient(180deg, var(--accent), var(--purple));
  border-radius: 2px;
  flex-shrink: 0;
}

.header-title .title-icon {
  font-size: 28px;
}

.header-sub {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 6px;
}

.btn-add {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  background: linear-gradient(135deg, var(--accent), #0f4bcc);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.18s;
  box-shadow: 0 4px 20px rgba(26,107,255,0.35);
  white-space: nowrap;
}
.btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(26,107,255,0.5); }
.btn-add:active { transform: translateY(0); }

/* ── CONTADOR ── */
.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--text-dim);
}

.stat-chip .stat-val {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-bright);
}

.stat-chip .sdot {
  width: 7px; height: 7px;
  border-radius: 50%;
  animation: blink 2.2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
.sdot.green { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
.sdot.blue  { background: var(--accent);  box-shadow: 0 0 6px var(--accent); }
.sdot.purp  { background: var(--purple);  box-shadow: 0 0 6px var(--purple); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 64px 20px;
  color: var(--text-dim);
  display: none;
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }
.empty-state p { font-size: 14px; letter-spacing: 1px; }

/* ── TARJETA CUENTA ── */
.cuentas-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.cuenta-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}

.cuenta-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--purple));
  border-radius: 3px 0 0 3px;
}

.cuenta-card:hover {
  border-color: var(--border2);
  box-shadow: 0 4px 30px rgba(26,107,255,0.12);
}

/* CABECERA TARJETA */
.card-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 20px 14px;
  cursor: pointer;
  user-select: none;
  position: relative;
}

.card-avatar {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(26,107,255,0.2), rgba(167,139,250,0.2));
  border: 1px solid rgba(167,139,250,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.card-info { flex: 1; min-width: 0; }

.card-mail {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-phone {
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  color: var(--accent2);
  margin-top: 3px;
  letter-spacing: 1px;
}

.card-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.wallet-badge {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 4px 10px;
  border-radius: 5px;
  white-space: nowrap;
}

.card-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.icon-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(26,107,255,0.1); }
.icon-btn.del:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,71,87,0.1); }

.card-toggle {
  font-size: 11px;
  color: var(--text-dim);
  transition: transform 0.2s;
  flex-shrink: 0;
  margin-left: 4px;
}
.card-toggle.open { transform: rotate(180deg); }

/* CUERPO TARJETA (expansible) */
.card-body {
  display: none;
  padding: 0 20px 20px;
  border-top: 1px solid var(--border);
}
.card-body.open { display: block; }

/* SECCIÓN BILLETERAS */
.section-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin: 16px 0 10px;
}

.wallets-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wallet-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}

.wallet-toggle:hover { border-color: var(--border2); }

.wallet-toggle.active {
  border-color: transparent;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
}

.wt-check {
  width: 14px; height: 14px;
  border-radius: 3px;
  border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  color: #fff;
  flex-shrink: 0;
  transition: all 0.12s;
}

.wallet-toggle.active .wt-check {
  border-color: transparent;
}

.wt-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text);
  transition: color 0.12s;
}

.wallet-toggle.active .wt-name { color: var(--text-bright); }

/* Colores por wallet */
.wallet-toggle[data-w="personal"]  { }
.wallet-toggle[data-w="personal"].active  { background: rgba(0,198,162,0.12);  border-color: rgba(0,198,162,0.4); }
.wallet-toggle[data-w="personal"].active .wt-check  { background: #00c6a2; }
.wallet-toggle[data-w="personal"].active .wt-name   { color: #00c6a2; }

.wallet-toggle[data-w="claro"].active    { background: rgba(255,71,87,0.12);  border-color: rgba(255,71,87,0.4); }
.wallet-toggle[data-w="claro"].active .wt-check    { background: #ff4757; }
.wallet-toggle[data-w="claro"].active .wt-name     { color: #ff4757; }

.wallet-toggle[data-w="astro"].active    { background: rgba(255,214,0,0.1);   border-color: rgba(255,214,0,0.4); }
.wallet-toggle[data-w="astro"].active .wt-check    { background: #FFD600; }
.wallet-toggle[data-w="astro"].active .wt-name     { color: #FFD600; }

.wallet-toggle[data-w="prex"].active     { background: rgba(26,107,255,0.12); border-color: rgba(26,107,255,0.4); }
.wallet-toggle[data-w="prex"].active .wt-check     { background: #1a6bff; }
.wallet-toggle[data-w="prex"].active .wt-name      { color: #1a6bff; }

.wallet-toggle[data-w="naranja"].active  { background: rgba(255,140,0,0.12);  border-color: rgba(255,140,0,0.4); }
.wallet-toggle[data-w="naranja"].active .wt-check  { background: #ff8c00; }
.wallet-toggle[data-w="naranja"].active .wt-name   { color: #ff8c00; }

.wallet-toggle[data-w="lemon"].active    { background: rgba(180,255,0,0.1);   border-color: rgba(180,255,0,0.35); }
.wallet-toggle[data-w="lemon"].active .wt-check    { background: #b4ff00; }
.wallet-toggle[data-w="lemon"].active .wt-name     { color: #b4ff00; }

.wallet-toggle[data-w="uala"].active     { background: rgba(138,43,226,0.12); border-color: rgba(138,43,226,0.4); }
.wallet-toggle[data-w="uala"].active .wt-check     { background: #8a2be2; }
.wallet-toggle[data-w="uala"].active .wt-name      { color: #c084fc; }

.wallet-toggle[data-w="arq"].active      { background: rgba(0,229,255,0.1);   border-color: rgba(0,229,255,0.35); }
.wallet-toggle[data-w="arq"].active .wt-check      { background: #00e5ff; }
.wallet-toggle[data-w="arq"].active .wt-name       { color: #00e5ff; }

.wallet-toggle[data-w="custom"].active   { background: rgba(167,139,250,0.12);border-color: rgba(167,139,250,0.4); }
.wallet-toggle[data-w="custom"].active .wt-check   { background: var(--purple); }
.wallet-toggle[data-w="custom"].active .wt-name    { color: var(--purple); }

/* INPUT NOMBRE CUSTOM */
.custom-wallet-input {
  background: transparent;
  border: none;
  outline: none;
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  width: 90px;
  letter-spacing: 0.5px;
}
.custom-wallet-input::placeholder { color: var(--text-dim); }
.wallet-toggle.active .custom-wallet-input { color: var(--purple); }

/* ── NOVEDADES ── */
.novedad-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 4px;
}
.novedad-btn:hover { border-color: var(--purple); color: var(--purple); }
.novedad-btn .nov-arrow { transition: transform 0.2s; font-size: 10px; }
.novedad-btn.open .nov-arrow { transform: rotate(180deg); }
.novedad-btn .nov-count {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  padding: 2px 7px;
  background: rgba(167,139,250,0.15);
  border-radius: 4px;
  color: var(--purple);
  margin-left: auto;
  margin-right: 8px;
}

.novedad-panel {
  display: none;
  margin-top: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.novedad-panel.open { display: block; }

.novedad-list {
  max-height: 220px;
  overflow-y: auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.novedad-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 10px;
  background: var(--surface3);
  border-radius: 8px;
  border: 1px solid var(--border);
  position: relative;
}

.novedad-date {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
  padding-top: 2px;
  letter-spacing: 0.5px;
}

.novedad-text {
  font-size: 15px;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
  word-break: break-word;
}

.novedad-del {
  width: 20px; height: 20px;
  border-radius: 4px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.12s;
}
.novedad-del:hover { background: rgba(255,71,87,0.15); color: var(--danger); }

.novedad-empty {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: 1px;
}

.novedad-add-row {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.novedad-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
}
.novedad-input::placeholder { color: var(--text-dim); }
.novedad-input:focus { border-color: var(--purple); }

.btn-novedad-add {
  padding: 10px 16px;
  background: linear-gradient(135deg, var(--purple), #7c3aed);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-novedad-add:hover { opacity: .88; transform: translateY(-1px); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  width: 100%;
  max-width: 480px;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  animation: modalIn 0.22s ease;
}
@keyframes modalIn { from { opacity:0; transform:translateY(16px) scale(.97); } to { opacity:1; transform:none; } }

.modal-head {
  padding: 22px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-bright);
}

.modal-close {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all 0.15s;
}
.modal-close:hover { border-color: var(--danger); color: var(--danger); }

.modal-body { padding: 20px 24px; }

.field-group { margin-bottom: 16px; }

.field-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 7px;
  display: block;
}

.field-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 14px;
  color: var(--text-bright);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field-input::placeholder { color: var(--text-dim); font-size: 14px; }
.field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,107,255,0.15); }

.modal-foot {
  padding: 14px 24px 22px;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  border-top: 1px solid var(--border);
}

.btn-cancel {
  padding: 10px 18px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-dim);
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-cancel:hover { border-color: var(--border2); color: var(--text); }

.btn-save {
  padding: 10px 22px;
  background: linear-gradient(135deg, var(--accent), #0f4bcc);
  border: none;
  border-radius: 9px;
  color: #fff;
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(26,107,255,0.3);
  transition: all 0.15s;
}
.btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,107,255,0.45); }

/* TOAST */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 11px 20px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text-bright);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  z-index: 200;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* TIPO CELULAR */
.card-tipo-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 5px;
}

.card-tipo-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
  white-space: nowrap;
}

.card-tipo-select {
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-bright);
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
  appearance: none;
  padding-right: 22px;

import { initializeApp }                                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const _fbApp = initializeApp({
  apiKey:            "AIzaSyCGRYyo9EmR0NB3TImzZIP4SuDpDwwMgVc",
  authDomain:        "planilla-perdidas---ganancias.firebaseapp.com",
  projectId:         "planilla-perdidas---ganancias",
  storageBucket:     "planilla-perdidas---ganancias.firebasestorage.app",
  messagingSenderId: "179047310261",
  appId:             "1:179047310261:web:2e5ad044d98751985d2ffc"
});
const _db  = getFirestore(_fbApp);
const COL  = 'cuentas';

// ── State ─────────────────────────────────────────────────────────────
let cuentas  = {};
let editingId = null;

// ── Wallets config ─────────────────────────────────────────────────────
const WALLETS = [
  { key:'personal', label:'PERSONAL PAY' },
  { key:'claro',    label:'CLARO PAY' },
  { key:'astro',    label:'ASTRO PAY' },
  { key:'prex',     label:'PREX' },
  { key:'naranja',  label:'NARANJA X' },
  { key:'lemon',    label:'LEMON' },
  { key:'uala',     label:'UALÁ' },
  { key:'arq',      label:'ARQ' },
];

// ── Firebase helpers ───────────────────────────────────────────────────
async function fbLoad() {
  try {
    const snap = await getDocs(collection(_db, COL));
    cuentas = {};
    snap.forEach(d => { cuentas[d.id] = d.data(); });
  } catch(e) { console.error('Load err', e); }
}

async function fbSave(id, data) {
  try { await setDoc(doc(_db, COL, id), data); } catch(e) { console.error('Save err', e); }
}

async function fbDelete(id) {
  try { await deleteDoc(doc(_db, COL, id)); } catch(e) { console.error('Del err', e); }
}

function genId() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

// ── Exponer funciones al HTML (onclick) ────────────────────────────────
window.uploadImg      = uploadImg;
window.deleteImg      = deleteImg;
window.openLightbox   = openLightbox;
window.closeLightbox  = closeLightbox;

// ── Imágenes (base64 en Firestore) ────────────────────────────────────
async function uploadImg(id, idx, input) {
  const file = input.files[0];
  if (!file) return;
  const loadEl = document.getElementById(`imgLoad-${id}-${idx}`);
  if (loadEl) loadEl.classList.add('show');

  try {
    const b64 = await resizeImage(file, 800);

    if (!cuentas[id].imgs) cuentas[id].imgs = [];
    cuentas[id].imgs[idx] = b64;
    await fbSave(id, cuentas[id]);

    const slot = document.getElementById(`imgSlot-${id}-${idx}`);
    if (slot) {
      slot.classList.add('has-img');
      slot.innerHTML = `
        <img src="${b64}" alt="foto ${idx+1}" onclick="openLightbox('${b64}')">
        <div class="img-loading" id="imgLoad-${id}-${idx}"></div>
        <button class="img-del-btn" onclick="deleteImg('${id}',${idx})">✕</button>
      `;
    }
    showToast('IMAGEN GUARDADA ✓');
  } catch(e) {
    console.error('Upload err', e);
    showToast('ERROR AL GUARDAR IMAGEN');
    if (loadEl) loadEl.classList.remove('show');
  }
}

async function deleteImg(id, idx) {
  if (!confirm('¿ELIMINAR ESTA FOTO?')) return;
  if (cuentas[id].imgs) cuentas[id].imgs[idx] = '';
  await fbSave(id, cuentas[id]);

  const slot = document.getElementById(`imgSlot-${id}-${idx}`);
  if (slot) {
    slot.classList.remove('has-img');
    slot.innerHTML = `
      <div class="img-slot-placeholder">📷<span>FOTO ${idx+1}</span></div>
      <div class="img-loading" id="imgLoad-${id}-${idx}"></div>
      <button class="img-del-btn" onclick="deleteImg('${id}',${idx})">✕</button>
      <input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%"
        onchange="uploadImg('${id}',${idx},this)">
    `;
  }
  showToast('IMAGEN ELIMINADA');
}

function resizeImage(file, maxPx) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        res(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

// ── Lightbox ──────────────────────────────────────────────────────────
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');

// ── Filtro por nombre ─────────────────────────────────────────────────
let currentFilter = '';

function filterCuentas(val) {
  currentFilter = val.trim().toLowerCase();
  const clearBtn = document.getElementById('searchClear');
  clearBtn.style.display = currentFilter ? 'block' : 'none';
  renderFiltered();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  filterCuentas('');
}

function renderFiltered() {
  const list  = document.getElementById('cuentasList');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('searchCount');

  // Ordenar por mail alfabéticamente
  const all = Object.keys(cuentas).sort((a, b) => {
    const ma = (cuentas[a].mail || '').toLowerCase();
    const mb = (cuentas[b].mail || '').toLowerCase();
    return ma.localeCompare(mb);
  });

  const filtered = currentFilter
    ? all.filter(id => {
        const d   = cuentas[id];
        const mail  = (d.mail        || '').toLowerCase();
        const phone = (d.phone       || '').toLowerCase();
        const ag    = (d.dispAgente  || '').toLowerCase();
        return mail.includes(currentFilter) || phone.includes(currentFilter) || ag.includes(currentFilter);
      })
    : all;

  list.innerHTML = '';

  if (!all.length) {
    empty.style.display = 'block';
    count.textContent = '';
    updateStats();
    return;
  }

  empty.style.display = 'none';
  count.textContent = currentFilter ? `${filtered.length}/${all.length}` : '';

  if (!filtered.length) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-dim);font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px">SIN RESULTADOS PARA "${currentFilter.toUpperCase()}"</div>`;
    return;
  }

  filtered.forEach(id => list.appendChild(buildCard(id, cuentas[id])));
  updateStats();
}

// ── Render principal ─────────────────────────────────────────────────
function render() {
  renderFiltered();
}

function buildCard(id, data) {
  const card = document.createElement('div');
  card.className = 'cuenta-card';
  card.id = `card-${id}`;

  // Badges activas
  const activeW = WALLETS.filter(w => data.wallets[w.key]);
  if (data.customActive && data.customWallet) activeW.push({ key:'custom', label: data.customWallet });
  const badgeHTML = activeW.slice(0,4).map(w => {
    const col = walletColor(w.key, data.customWallet);
    return `<span class="wallet-badge" style="background:${col.bg};color:${col.fg};border:1px solid ${col.border}">${w.label}</span>`;
  }).join('') + (activeW.length > 4 ? `<span class="wallet-badge" style="background:var(--surface3);color:var(--text-dim);border:1px solid var(--border)">+${activeW.length-4}</span>` : '');

  const novCount = (data.novedades || []).length;

  card.innerHTML = `
    <div class="card-head" onclick="toggleCard('${id}')">
      <div class="card-avatar">📱</div>
      <div class="card-info">
        <div class="card-mail">${data.mail || '—'}</div>
        <div class="card-phone">${data.phone || 'SIN TELÉFONO'}</div>
        <div class="card-tipo-row" onclick="event.stopPropagation()">
          <span class="card-tipo-label">CELULAR DE:</span>
          <select class="card-tipo-select" id="tipoSel-${id}" onchange="saveTipo('${id}',this.value)">
            <option value=""   ${!data.tipo ? 'selected' : ''}>—</option>
            <option value="ofi" ${ data.tipo==='ofi' ? 'selected' : ''}>OFI</option>
            <option value="age" ${ data.tipo==='age' ? 'selected' : ''}>AGE</option>
            <option value="dmn" ${ data.tipo==='dmn' ? 'selected' : ''}>DMN</option>
          </select>
          ${data.tipo ? `<span class="tipo-badge tipo-${data.tipo}">${data.tipo.toUpperCase()}</span>` : ''}
        </div>
        <div class="card-tipo-row" onclick="event.stopPropagation()">
          <span class="card-tipo-label">ESTADO:</span>
          <select class="card-tipo-select" id="estadoSel-${id}" onchange="saveEstado('${id}',this.value)">
            <option value=""          ${!data.estado ? 'selected' : ''}>—</option>
            <option value="porhacer"  ${ data.estado==='porhacer'  ? 'selected' : ''}>POR HACER</option>
            <option value="hecho"     ${ data.estado==='hecho'     ? 'selected' : ''}>HECHO</option>
            <option value="descarte"  ${ data.estado==='descarte'  ? 'selected' : ''}>DESCARTE EMI</option>
          </select>
          ${data.estado ? `<span class="estado-badge estado-${data.estado}">${estadoLabel(data.estado)}</span>` : ''}
        </div>
        <div class="card-badges" id="badges-${id}">${badgeHTML}</div>
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="icon-btn" title="Editar" onclick="editCuenta('${id}')">✏️</button>
        <button class="icon-btn del" title="Eliminar" onclick="deleteCuenta('${id}')">🗑</button>
      </div>
      <div class="card-toggle" id="toggle-${id}">▼</div>
    </div>

    <!-- FOTOS SIEMPRE VISIBLES -->
    <div class="card-photos" onclick="event.stopPropagation()">
      <div class="photos-label">📷 FOTOS DEL EQUIPO</div>
      <div class="imgs-grid" style="padding:0 0 4px 0">
        ${[0,1].map(i => {
          const url = data.imgs && data.imgs[i] ? data.imgs[i] : '';
          return `
          <div class="img-slot ${url ? 'has-img' : ''}" id="imgSlot-${id}-${i}">
            ${url
              ? `<img src="${url}" alt="foto ${i+1}" onclick="openLightbox('${url}')">`
              : `<div class="img-slot-placeholder">📷<span>FOTO ${i+1}</span></div>`
            }
            <div class="img-loading" id="imgLoad-${id}-${i}">SUBIENDO...</div>
            <button class="img-del-btn" onclick="deleteImg('${id}',${i})">✕</button>
            <input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%" onchange="uploadImg('${id}',${i},this)">
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card-body" id="body-${id}">
      <div class="section-label">BILLETERAS VINCULADAS</div>
      <div class="wallets-grid" id="wallets-${id}">
        ${WALLETS.map(w => `
          <div class="wallet-toggle ${data.wallets[w.key] ? 'active' : ''}" data-w="${w.key}" onclick="toggleWallet('${id}','${w.key}',this)">
            <div class="wt-check">${data.wallets[w.key] ? '✓' : ''}</div>
            <span class="wt-name">${w.label}</span>
          </div>
        `).join('')}
        <div class="wallet-toggle ${data.customActive ? 'active' : ''}" data-w="custom" onclick="toggleCustom('${id}',this)">
          <div class="wt-check">${data.customActive ? '✓' : ''}</div>
          <input class="custom-wallet-input" id="customInput-${id}" placeholder="OTRA CUENTA"
            value="${data.customWallet || ''}"
            onclick="event.stopPropagation()"
            oninput="saveCustomName('${id}',this.value)">
        </div>
      </div>

      <div class="section-label" style="margin-top:18px">📱 DISPOSITIVO ENTREGADO</div>
      <div class="dispositivo-box">
        <div class="disp-row">
          <div class="disp-field">
            <span class="disp-label">MARCA / MODELO</span>
            <input class="disp-input" id="dispModelo-${id}" placeholder="Ej: Samsung A30"
              value="${escHtml(data.dispModelo||'')}"
              oninput="saveDisp('${id}')" onkeydown="if(event.key==='Enter')saveDisp('${id}')">
          </div>
          <div class="disp-field">
            <span class="disp-label">CARACTERÍSTICAS</span>
            <input class="disp-input" id="dispCaract-${id}" placeholder="Ej: Pantalla rajada"
              value="${escHtml(data.dispCaract||'')}"
              oninput="saveDisp('${id}')" onkeydown="if(event.key==='Enter')saveDisp('${id}')">
          </div>
        </div>
        <div class="disp-row">
          <div class="disp-field">
            <span class="disp-label">ENTREGADO A</span>
            <input class="disp-input" id="dispAgente-${id}" placeholder="Ej: Mayra"
              value="${escHtml(data.dispAgente||'')}"
              oninput="saveDisp('${id}')" onkeydown="if(event.key==='Enter')saveDisp('${id}')">
          </div>
          <div class="disp-field">
            <span class="disp-label">FECHA DE ENTREGA</span>
            <input class="disp-input" id="dispFecha-${id}" type="date"
              value="${data.dispFecha||''}"
              onchange="saveDisp('${id}')">
          </div>
        </div>
        <div id="dispTag-${id}">${(data.dispAgente||data.dispFecha) ? `
        <div class="disp-entrega-tag">
          📦 ENTREGADO A ${escHtml(data.dispAgente||'—')} EL ${data.dispFecha ? formatFecha(data.dispFecha) : '—'}
        </div>` : ''}</div>
        <button class="disp-save-btn" onclick="saveDisp('${id}',true)">GUARDAR DISPOSITIVO</button>
      </div>

      <div class="section-label" style="margin-top:18px">📋 DISPOSITIVO ENTREGADO</div>
      <button class="novedad-btn ${novCount ? '' : ''}" id="novBtn-${id}" onclick="toggleNov('${id}')">
        <span>📝 ANOTACIONES</span>
        <span class="nov-count" id="novCount-${id}">${novCount} NOTA${novCount !== 1 ? 'S' : ''}</span>
        <span class="nov-arrow">▼</span>
      </button>
      <div class="novedad-panel" id="novPanel-${id}">
        <div class="novedad-list" id="novList-${id}">
          ${renderNovedades(id, data.novedades)}
        </div>
        <div class="novedad-add-row">
          <input class="novedad-input" id="novInput-${id}" placeholder="Escribir anotación..." onkeydown="if(event.key==='Enter')addNovedad('${id}')">
          <button class="btn-novedad-add" onclick="addNovedad('${id}')">+ AGREGAR</button>
        </div>
      </div>
    </div>
  `;
  return card;
}

function renderNovedades(id, novedades) {
  if (!novedades || !novedades.length) return '<div class="novedad-empty">SIN ANOTACIONES AÚN</div>';
  return novedades.map((n, i) => `
    <div class="novedad-item">
      <div class="novedad-date">${n.date}</div>
      <div class="novedad-text">${escHtml(n.text)}</div>
      <button class="novedad-del" onclick="deleteNovedad('${id}',${i})" title="Eliminar">✕</button>
    </div>
  `).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function walletColor(key, customName) {
  const map = {
    personal: { bg:'rgba(0,198,162,0.12)',   fg:'#00c6a2', border:'rgba(0,198,162,0.35)' },
    claro:    { bg:'rgba(255,71,87,0.12)',    fg:'#ff4757', border:'rgba(255,71,87,0.35)' },
    astro:    { bg:'rgba(255,214,0,0.1)',     fg:'#FFD600', border:'rgba(255,214,0,0.35)' },
    prex:     { bg:'rgba(26,107,255,0.12)',   fg:'#5c9bff', border:'rgba(26,107,255,0.35)' },
    naranja:  { bg:'rgba(255,140,0,0.12)',    fg:'#ff8c00', border:'rgba(255,140,0,0.35)' },
    lemon:    { bg:'rgba(180,255,0,0.1)',     fg:'#b4ff00', border:'rgba(180,255,0,0.3)' },
    uala:     { bg:'rgba(138,43,226,0.12)',   fg:'#c084fc', border:'rgba(138,43,226,0.35)' },
    arq:      { bg:'rgba(0,229,255,0.1)',     fg:'#00e5ff', border:'rgba(0,229,255,0.3)' },
    custom:   { bg:'rgba(167,139,250,0.12)',  fg:'#a78bfa', border:'rgba(167,139,250,0.35)' },
  };
  return map[key] || map.custom;
}

function estadoLabel(val) {
  const map = { porhacer:'POR HACER', hecho:'HECHO', descarte:'DESCARTE EMI' };
  return map[val] || val;
}

async function saveEstado(id, val) {
  cuentas[id].estado = val;
  await fbSave(id, cuentas[id]);
  const row = document.getElementById(`estadoSel-${id}`)?.parentElement;
  if (row) {
    const old = row.querySelector('.estado-badge');
    if (old) old.remove();
    if (val) {
      const b = document.createElement('span');
      b.className = `estado-badge estado-${val}`;
      b.textContent = estadoLabel(val);
      row.appendChild(b);
    }
  }
  showToast('ESTADO GUARDADO');
}

async function saveTipo(id, val) {
  cuentas[id].tipo = val;
  await fbSave(id, cuentas[id]);
  // actualizar badge sin re-render
  const row = document.getElementById(`tipoSel-${id}`)?.parentElement;
  if (row) {
    const old = row.querySelector('.tipo-badge');
    if (old) old.remove();
    if (val) {
      const b = document.createElement('span');
      b.className = `tipo-badge tipo-${val}`;
      b.textContent = val.toUpperCase();
      row.appendChild(b);
    }
  }
  showToast('TIPO GUARDADO');
}

// ── Dispositivo ──────────────────────────────────────────────────────
function formatFecha(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

async function saveDisp(id, showToastFlag) {
  cuentas[id].dispModelo = document.getElementById(`dispModelo-${id}`)?.value || '';
  cuentas[id].dispCaract = document.getElementById(`dispCaract-${id}`)?.value || '';
  cuentas[id].dispAgente = document.getElementById(`dispAgente-${id}`)?.value || '';
  cuentas[id].dispFecha  = document.getElementById(`dispFecha-${id}`)?.value  || '';
  clearTimeout(window._dispT);
  window._dispT = setTimeout(async () => {
    await fbSave(id, cuentas[id]);
    // actualizar tag de entrega sin re-renderizar toda la tarjeta
    const box = document.getElementById(`dispTag-${id}`);
    if (box) {
      const ag = cuentas[id].dispAgente;
      const fe = cuentas[id].dispFecha;
      box.innerHTML = (ag||fe) ? `<div class="disp-entrega-tag">📦 ENTREGADO A ${escHtml(ag||'—')} EL ${formatFecha(fe)}</div>` : '';
    }
    if (showToastFlag) showToast('DISPOSITIVO GUARDADO');
  }, 600);
}

// ── Toggle card ──────────────────────────────────────────────────────
function toggleCard(id) {
  const body = document.getElementById(`body-${id}`);
  const tog = document.getElementById(`toggle-${id}`);
  body.classList.toggle('open');
  tog.classList.toggle('open');
}

// ── Toggle wallet ────────────────────────────────────────────────────
async function toggleWallet(id, key, el) {
  cuentas[id].wallets[key] = !cuentas[id].wallets[key];
  el.classList.toggle('active');
  el.querySelector('.wt-check').textContent = cuentas[id].wallets[key] ? '✓' : '';
  updateBadges(id);
  await fbSave(id, cuentas[id]);
  updateStats();
}

async function toggleCustom(id, el) {
  cuentas[id].customActive = !cuentas[id].customActive;
  el.classList.toggle('active');
  el.querySelector('.wt-check').textContent = cuentas[id].customActive ? '✓' : '';
  updateBadges(id);
  await fbSave(id, cuentas[id]);
  updateStats();
}

async function saveCustomName(id, val) {
  cuentas[id].customWallet = val;
  clearTimeout(window._customT);
  window._customT = setTimeout(async () => {
    await fbSave(id, cuentas[id]);
    updateBadges(id);
  }, 700);
}

function updateBadges(id) {
  const data = cuentas[id];
  const activeW = WALLETS.filter(w => data.wallets[w.key]);
  if (data.customActive && data.customWallet) activeW.push({ key:'custom', label: data.customWallet });
  const badgeEl = document.getElementById(`badges-${id}`);
  if (!badgeEl) return;
  badgeEl.innerHTML = activeW.slice(0,4).map(w => {
    const col = walletColor(w.key);
    return `<span class="wallet-badge" style="background:${col.bg};color:${col.fg};border:1px solid ${col.border}">${w.label}</span>`;
  }).join('') + (activeW.length > 4 ? `<span class="wallet-badge" style="background:var(--surface3);color:var(--text-dim);border:1px solid var(--border)">+${activeW.length-4}</span>` : '');
}

// ── Novedades ────────────────────────────────────────────────────────
function toggleNov(id) {
  const panel = document.getElementById(`novPanel-${id}`);
  const btn = document.getElementById(`novBtn-${id}`);
  panel.classList.toggle('open');
  btn.classList.toggle('open');
}

async function addNovedad(id) {
  const inp = document.getElementById(`novInput-${id}`);
  const text = inp.value.trim();
  if (!text) return;
  const now = new Date();
  const date = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if (!cuentas[id].novedades) cuentas[id].novedades = [];
  cuentas[id].novedades.unshift({ text, date });
  inp.value = '';
  await fbSave(id, cuentas[id]);
  const listEl = document.getElementById(`novList-${id}`);
  listEl.innerHTML = renderNovedades(id, cuentas[id].novedades);
  updateNovCount(id);
  updateStats();
  showToast('ANOTACIÓN GUARDADA');
}

async function deleteNovedad(id, idx) {
  cuentas[id].novedades.splice(idx, 1);
  await fbSave(id, cuentas[id]);
  const listEl = document.getElementById(`novList-${id}`);
  listEl.innerHTML = renderNovedades(id, cuentas[id].novedades);
  updateNovCount(id);
  updateStats();
}

function updateNovCount(id) {
  const n = (cuentas[id].novedades || []).length;
  const el = document.getElementById(`novCount-${id}`);
  if (el) el.textContent = `${n} NOTA${n !== 1 ? 'S' : ''}`;
}

// ── Modal ────────────────────────────────────────────────────────────
function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'EDITAR CUENTA' : 'NUEVA CUENTA';
  document.getElementById('inputMail').value  = id ? cuentas[id].mail  : '';
  document.getElementById('inputPhone').value = id ? cuentas[id].phone : '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('inputMail').focus(), 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

async function saveCuenta() {
  const mail  = document.getElementById('inputMail').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();
  if (!mail) { document.getElementById('inputMail').focus(); return; }

  const id = editingId || genId();
  if (!editingId) {
    cuentas[id] = { mail, phone, wallets:{}, novedades:[], customWallet:'', customActive:false };
  } else {
    cuentas[id].mail  = mail;
    cuentas[id].phone = phone;
  }
  await fbSave(id, cuentas[id]);
  closeModal();
  render();
  showToast(editingId ? 'CUENTA ACTUALIZADA' : 'CUENTA GUARDADA');
}

function editCuenta(id) {
  openModal(id);
}

async function deleteCuenta(id) {
  if (!confirm('¿ELIMINAR ESTA CUENTA?')) return;
  await fbDelete(id);
  delete cuentas[id];
  render();
  showToast('CUENTA ELIMINADA');
}

// ── Stats ────────────────────────────────────────────────────────────
function updateStats() {
  const ids = Object.keys(cuentas);
  let wallets = 0, nov = 0;
  ids.forEach(id => {
    const d = cuentas[id];
    wallets += Object.values(d.wallets || {}).filter(Boolean).length + (d.customActive ? 1 : 0);
    nov += (d.novedades || []).length;
  });
  document.getElementById('statTotal').textContent   = ids.length;
  document.getElementById('statWallets').textContent = wallets;
  document.getElementById('statNov').textContent     = nov;
}

// ── Toast ────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Keyboard / click outside ─────────────────────────────────────────
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) saveCuenta();
});

// ── Init ─────────────────────────────────────────────────────────────
(async () => {
  await fbLoad();
  render();
})();
</script>
</body>
</html>
