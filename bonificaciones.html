<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONIFICACIONES</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0500;font-family:Calibri,Arial,sans-serif;font-size:13px;color:#ffb97a;min-height:100vh;padding:16px;}
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;gap:20px;}
.login-box{background:#1a0800;border:1px solid #7a2900;border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:280px;box-shadow:0 4px 24px rgba(0,0,0,.5);}
.login-title{color:#FFD600;font-size:20px;font-weight:700;letter-spacing:3px;text-align:center;}
.login-sub{color:#7a4a00;font-size:11px;letter-spacing:2px;text-align:center;}
.pin-dots{display:flex;gap:12px;margin:8px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #5a2a00;background:transparent;transition:all .2s;}
.pin-dot.filled{background:#FFD600;border-color:#FFD600;box-shadow:0 0 8px #FFD600;}
.pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;}
.pin-btn{width:64px;height:48px;background:#1a0800;border:1px solid #5a2a00;color:#FFD600;font-size:18px;font-weight:700;border-radius:6px;cursor:pointer;transition:all .15s;}
.pin-btn:hover{background:#2e1400;border-color:#FFD600;}
.pin-clear{color:#ff6b6b;border-color:#5a1a1a;}
.pin-error{color:#ff6b6b;font-size:12px;letter-spacing:1px;min-height:18px;text-align:center;}
#appScreen{display:none;}
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:linear-gradient(135deg,#5a1a00 0%,#9c3d00 100%);color:#fff;padding:12px 20px;border-radius:8px 8px 0 0;}
.top-bar .title{font-size:17px;font-weight:700;letter-spacing:2px;color:#FFD600;}
.btn-logout{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#ffb97a;font-size:11px;font-weight:700;letter-spacing:1px;padding:5px 14px;border-radius:4px;cursor:pointer;}
.tab-btn{background:#2a1000;border:1px solid #7a2900;color:#aaa;border-radius:6px;padding:6px 16px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;}
.tab-btn.active{background:#9c3d00;color:#FFD600;border-color:#FFD600;}
.controls-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#1a0800;padding:10px 16px;border:1px solid #5a2a00;border-top:none;}
.controls-bar label{color:#ffb97a;font-size:11px;letter-spacing:1px;font-weight:700;}
.controls-bar input[type=date],.controls-bar input[type=month]{background:#0a0500;border:1px solid #7a2900;color:#FFD600;border-radius:5px;padding:4px 10px;font-size:13px;font-weight:700;outline:none;}
.btn-ver{background:linear-gradient(135deg,#9c3d00,#5a1a00);border:none;color:#FFD600;border-radius:5px;padding:7px 18px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-save{background:linear-gradient(135deg,#1d6b34,#0d3a1e);border:none;color:#80FFB0;border-radius:5px;padding:7px 18px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.stmsg{font-size:11px;letter-spacing:1px;}
.st-ok{color:#80FFB0;}.st-warn{color:#FFB347;}.st-info{color:#888;}.st-err{color:#ff6b6b;}
.content-wrap{background:#120800;border:1px solid #5a2a00;border-top:none;border-radius:0 0 8px 8px;padding:16px;overflow-x:auto;min-height:200px;}
table.bt{width:100%;border-collapse:collapse;min-width:500px;}
.bt th{background:#2a1000;color:#ffb97a;font-size:10px;letter-spacing:1px;padding:9px 12px;text-align:center;border:1px solid #5a2a00;text-transform:uppercase;}
.bt th.tha{text-align:left;min-width:140px;}
.bt td{padding:6px 8px;text-align:center;border:1px solid #2a1000;vertical-align:middle;}
.bt tr:nth-child(odd) td{background:#1a0800;}.bt tr:nth-child(even) td{background:#220d00;}
.bt tr:hover td{background:#2e1400;}
.tda{color:#FFD600;font-weight:700;font-size:13px;text-align:left;padding-left:12px !important;}
input.bpct{width:75px;background:#0a0300;border:1px solid #5a2a00;color:#FFD600;text-align:center;font-size:15px;font-weight:700;border-radius:4px;padding:4px 5px;font-family:'Courier New',monospace;outline:none;}
input.bpct:focus{border-color:#FFD600;background:#150800;}
.bdg{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;}
.bdg-TM{background:#1a3a6b;color:#7aa8ff;}.bdg-TT{background:#3a2800;color:#FFD600;}.bdg-TN{background:#2a0d3a;color:#cc88ff;}
table.mt{width:100%;border-collapse:collapse;min-width:600px;}
.mt th{background:#2a1000;color:#ffb97a;font-size:10px;letter-spacing:1px;padding:9px 12px;text-align:center;border:1px solid #5a2a00;text-transform:uppercase;}
.mt td{padding:7px 12px;text-align:center;border:1px solid #2a1000;font-size:12px;vertical-align:middle;}
.mt tr:nth-child(odd) td{background:#1a0800;}.mt tr:nth-child(even) td{background:#220d00;}
.pv{color:#FFD600;font-weight:700;font-family:'Courier New',monospace;font-size:13px;}
.pz{color:#3a2000;}.pd{color:#888;font-size:11px;}
.pp{color:#FF8C00;font-weight:700;font-family:'Courier New',monospace;font-size:14px;}
.tr-tot td{background:linear-gradient(135deg,#5a1a00,#9c3d00) !important;color:#fff;font-weight:700;border:1px solid #FFD600 !important;}
.emptymsg{color:#3a2000;text-align:center;padding:30px;font-size:13px;letter-spacing:1px;}
.loadmsg{color:#7a4a00;text-align:center;padding:30px;font-size:13px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-title">🎯 BONIFICACIONES</div>
    <div class="login-sub">INGRESÁ TU PIN DE ACCESO</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pp('1')">1</button>
      <button class="pin-btn" onclick="pp('2')">2</button>
      <button class="pin-btn" onclick="pp('3')">3</button>
      <button class="pin-btn" onclick="pp('4')">4</button>
      <button class="pin-btn" onclick="pp('5')">5</button>
      <button class="pin-btn" onclick="pp('6')">6</button>
      <button class="pin-btn" onclick="pp('7')">7</button>
      <button class="pin-btn" onclick="pp('8')">8</button>
      <button class="pin-btn" onclick="pp('9')">9</button>
      <button class="pin-btn pin-clear" onclick="pc()">✕</button>
      <button class="pin-btn" onclick="pp('0')">0</button>
      <button class="pin-btn pin-clear" onclick="pb()">⌫</button>
    </div>
    <div class="pin-error" id="pinErr"></div>
  </div>
</div>

<div id="appScreen">
  <div class="top-bar">
    <div class="title">🎯 BONIFICACIONES</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="modeTabs" style="display:none;gap:8px;align-items:center;">
        <button class="tab-btn active" id="btnD" onclick="setMode('d')">📅 DIARIA</button>
        <button class="tab-btn" id="btnM" onclick="setMode('m')">📆 MENSUAL</button>
      </div>
      <button class="btn-logout" id="btnSalir" onclick="salir()" style="display:none;">🔒 SALIR</button>
    </div>
  </div>
  <div class="controls-bar" id="ctrlD">
    <label>FECHA</label>
    <input type="date" id="iFecha">
    <button class="btn-ver" onclick="verDiaria()">🔍 VER</button>
    <button class="btn-save" id="btnGuardar" onclick="guardar()" style="display:none;">💾 GUARDAR</button>
    <span class="stmsg st-info" id="stD"></span>
  </div>
  <div class="controls-bar" id="ctrlM" style="display:none;">
    <label>MES</label>
    <input type="month" id="iMes">
    <button class="btn-ver" onclick="verMensual()">🔍 VER</button>
    <span class="stmsg st-info" id="stM"></span>
  </div>
  <div class="content-wrap" id="cWrap">
    <div class="emptymsg">Seleccioná una fecha y presioná VER.</div>
  </div>
</div>

<!-- Firebase scripts (NO module) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCGRYyo9EmR0NB3TImzZIP4SuDpDwwMgVc",
  authDomain: "planilla-perdidas---ganancias.firebaseapp.com",
  projectId: "planilla-perdidas---ganancias",
  storageBucket: "planilla-perdidas---ganancias.firebasestorage.app",
  messagingSenderId: "179047310261",
  appId: "1:179047310261:web:2e5ad044d98751985d2ffc"
});
const db = firebase.firestore();

const PIN_OP = '1408';
const AGENTS = [
  {id:'AGE18',lb:'AGE 18'},{id:'AGE19',lb:'AGE 19'},{id:'AGE21',lb:'AGE 21'},
  {id:'AGE22',lb:'AGE 22'},{id:'AGE23',lb:'AGE 23'},{id:'AGE24',lb:'AGE 24'},
  {id:'AGE25',lb:'AGE 25'},{id:'SIEMPREMONO',lb:'SIEMPRE MONO'}
];
const SHIFTS = [{k:'TM',lb:'MAÑANA'},{k:'TT',lb:'TARDE'},{k:'TN',lb:'NOCHE'}];
const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

let esAdmin = false;
let pinBuf = '';

// ── INIT ──
window.onload = function(){
  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('iFecha').value = hoy;
  document.getElementById('iMes').value = hoy.slice(0,7);
  // Si viene con ?admin=1 = es admin, sin PIN
  const params = new URLSearchParams(window.location.search);
  if(params.get('admin')==='1'){
    esAdmin = true;
    abrirApp(true);
  }
};

function abrirApp(admin){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = '';
  document.getElementById('modeTabs').style.display = admin ? 'flex' : 'none';
  document.getElementById('btnSalir').style.display = admin ? 'none' : '';
  verDiaria();
}

// ── PIN ──
function pp(d){
  if(pinBuf.length>=4) return;
  pinBuf+=d; updDots();
  if(pinBuf.length===4) checkPin();
}
function pb(){ pinBuf=pinBuf.slice(0,-1); updDots(); document.getElementById('pinErr').textContent=''; }
function pc(){ pinBuf=''; updDots(); document.getElementById('pinErr').textContent=''; }
function updDots(){ for(var i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled',i<pinBuf.length); }
function checkPin(){
  if(pinBuf===PIN_OP){ esAdmin=false; abrirApp(false); }
  else {
    document.getElementById('pinErr').textContent='❌ PIN incorrecto';
    pinBuf=''; updDots();
    setTimeout(function(){ document.getElementById('pinErr').textContent=''; },2000);
  }
}
function salir(){
  pinBuf=''; updDots();
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

// ── MODO ──
function setMode(m){
  document.getElementById('btnD').classList.toggle('active',m==='d');
  document.getElementById('btnM').classList.toggle('active',m==='m');
  document.getElementById('ctrlD').style.display=m==='d'?'flex':'none';
  document.getElementById('ctrlM').style.display=m==='m'?'flex':'none';
  document.getElementById('btnGuardar').style.display='none';
  document.getElementById('cWrap').innerHTML='<div class="emptymsg">Presioná VER.</div>';
}

// ── FIREBASE ──
function getFB(dk, cb){
  db.collection('bonificaciones').doc(dk).get()
    .then(function(s){ cb(s.exists?s.data():{}); })
    .catch(function(){ cb({}); });
}
function setFB(dk, data, cb){
  db.collection('bonificaciones').doc(dk).set(data)
    .then(cb).catch(function(e){ cb(e); });
}

// ── DIARIA ──
function verDiaria(){
  var dk=document.getElementById('iFecha').value;
  if(!dk){ stD('Seleccioná una fecha.','st-info'); return; }
  document.getElementById('btnGuardar').style.display='none';
  stD('⏳ Cargando...','st-info');
  document.getElementById('cWrap').innerHTML='<div class="loadmsg">⏳ Cargando desde Firebase...</div>';
  getFB(dk, function(data){
    var parts=dk.split('-'), yy=parts[0],mm=parts[1],dd=parts[2];
    var dias=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
    var diaLbl=dias[new Date(dk+'T12:00:00').getDay()];
    var h='<div style="color:#ffb97a;font-size:11px;letter-spacing:2px;margin-bottom:10px;">📅 '+diaLbl+' <span style="color:#FFD600;font-weight:700;">'+dd+'/'+mm+'/'+yy+'</span></div>';
    h+='<table class="bt"><thead><tr><th class="tha">AGENTE</th>';
    h+='<th><span class="bdg bdg-TM">TM</span> MAÑANA</th>';
    h+='<th><span class="bdg bdg-TT">TT</span> TARDE</th>';
    h+='<th><span class="bdg bdg-TN">TN</span> NOCHE</th>';
    h+='</tr></thead><tbody>';
    AGENTS.forEach(function(ag){
      h+='<tr><td class="tda">'+ag.lb+'</td>';
      SHIFTS.forEach(function(sh){
        var v=(data[ag.id]&&data[ag.id][sh.k])||'';
        h+='<td><input class="bpct" type="number" min="0" max="100" step="0.5" placeholder="%" value="'+v+'" data-ag="'+ag.id+'" data-sh="'+sh.k+'" data-dk="'+dk+'" oninput="stD(\'⚠ Sin guardar\',\'st-warn\')"></td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table><div style="color:#3a2000;font-size:10px;margin-top:12px;">* % de bonificación por turno. Ej: 10 = 10%</div>';
    document.getElementById('cWrap').innerHTML=h;
    document.getElementById('btnGuardar').style.display='';
    stD('Datos cargados.','st-info');
  });
}

function guardar(){
  var inputs=document.querySelectorAll('#cWrap input.bpct');
  var btn=document.getElementById('btnGuardar');
  btn.disabled=true;
  stD('💾 Guardando...','st-info');
  // Agrupar por dk
  var byDk={};
  inputs.forEach(function(el){
    var dk=el.dataset.dk,ag=el.dataset.ag,sh=el.dataset.sh,val=el.value.trim();
    if(!byDk[dk]) byDk[dk]={};
    if(!byDk[dk][ag]) byDk[dk][ag]={};
    if(val!==''&&val!=='0') byDk[dk][ag][sh]=val;
  });
  var dks=Object.keys(byDk);
  if(!dks.length){ stD('Sin datos.','st-info'); btn.disabled=false; return; }
  var dk=dks[0];
  getFB(dk, function(existing){
    var merged=Object.assign({},existing);
    AGENTS.forEach(function(ag){
      if(!merged[ag.id]) merged[ag.id]={};
      SHIFTS.forEach(function(sh){
        if(byDk[dk][ag.id]&&byDk[dk][ag.id][sh.k]) merged[ag.id][sh.k]=byDk[dk][ag.id][sh.k];
        else delete merged[ag.id][sh.k];
      });
      if(Object.keys(merged[ag.id]).length===0) delete merged[ag.id];
    });
    setFB(dk, merged, function(err){
      if(err&&err.message){ stD('❌ Error: '+err.message,'st-err'); }
      else { stD('✅ Guardado en Firebase','st-ok'); }
      btn.disabled=false;
    });
  });
}

// ── MENSUAL ──
function verMensual(){
  if(!esAdmin) return;
  var mes=document.getElementById('iMes').value;
  if(!mes){ stM('Seleccioná un mes.','st-info'); return; }
  stM('⏳ Cargando...','st-info');
  document.getElementById('cWrap').innerHTML='<div class="loadmsg">⏳ Cargando desde Firebase...</div>';
  var parts=mes.split('-'),yy=parts[0],mm=parts[1];
  var diasEnMes=new Date(parseInt(yy),parseInt(mm),0).getDate();
  var mesLbl=MESES[parseInt(mm)-1]+' '+yy;
  var dkList=[];
  for(var d=1;d<=diasEnMes;d++) dkList.push(yy+'-'+mm+'-'+(d<10?'0':'')+d);

  // Cargar todos en paralelo
  var allData={}, pending=dkList.length, loaded=0;
  dkList.forEach(function(dk){
    getFB(dk, function(data){
      if(Object.keys(data).length>0) allData[dk]=data;
      loaded++;
      if(loaded===pending) renderMensual(yy,mm,mesLbl,dkList,allData);
    });
  });
}

function renderMensual(yy,mm,mesLbl,dkList,allData){
  var diasConDatos=dkList.map(function(dk,i){ return {dk:dk,d:i+1}; }).filter(function(x){ return !!allData[x.dk]; });
  var totals={},counts={};
  AGENTS.forEach(function(ag){
    totals[ag.id]={}; counts[ag.id]={};
    SHIFTS.forEach(function(sh){ totals[ag.id][sh.k]=0; counts[ag.id][sh.k]=0; });
  });
  diasConDatos.forEach(function(x){
    AGENTS.forEach(function(ag){
      SHIFTS.forEach(function(sh){
        var v=allData[x.dk]&&allData[x.dk][ag.id]&&allData[x.dk][ag.id][sh.k];
        if(v!==undefined&&v!==''){totals[ag.id][sh.k]+=parseFloat(v)||0;counts[ag.id][sh.k]++;}
      });
    });
  });

  var h='<div style="color:#ffb97a;font-size:11px;letter-spacing:2px;margin-bottom:12px;">📆 RESUMEN — <span style="color:#FFD600;font-weight:700;">'+mesLbl+'</span></div>';
  h+='<table class="mt"><thead><tr><th style="text-align:left;min-width:140px;">AGENTE</th>';
  h+='<th><span class="bdg bdg-TM">TM</span> PROM.</th><th><span class="bdg bdg-TT">TT</span> PROM.</th><th><span class="bdg bdg-TN">TN</span> PROM.</th>';
  h+='<th>DÍAS</th><th>PROM. GRAL.</th></tr></thead><tbody>';

  var totSum=0,totCnt=0;
  AGENTS.forEach(function(ag){
    var proms={},agSum=0,agCnt=0;
    SHIFTS.forEach(function(sh){
      proms[sh.k]=counts[ag.id][sh.k]>0?totals[ag.id][sh.k]/counts[ag.id][sh.k]:null;
      if(proms[sh.k]!==null){agSum+=totals[ag.id][sh.k];agCnt+=counts[ag.id][sh.k];}
    });
    var dias=Math.max.apply(null,SHIFTS.map(function(sh){return counts[ag.id][sh.k];}));
    var pg=agCnt>0?agSum/agCnt:null;
    if(pg!==null){totSum+=agSum;totCnt+=agCnt;}
    h+='<tr><td class="tda">'+ag.lb+'</td>';
    SHIFTS.forEach(function(sh){ h+=proms[sh.k]===null?'<td class="pz">—</td>':'<td class="pv">'+proms[sh.k].toFixed(1)+'%</td>'; });
    h+='<td class="pd">'+(dias>0?dias:'—')+'</td><td class="'+(pg!==null?'pp':'pz')+'">'+(pg!==null?pg.toFixed(1)+'%':'—')+'</td></tr>';
  });
  var pt=totCnt>0?totSum/totCnt:null;
  h+='<tr class="tr-tot"><td style="color:#FFD600;font-weight:700;padding-left:12px;">PROMEDIO GENERAL</td><td colspan="3"></td>';
  h+='<td class="pd">'+diasConDatos.length+' días</td><td class="'+(pt!==null?'pp':'pz')+'">'+(pt!==null?pt.toFixed(1)+'%':'—')+'</td></tr>';
  h+='</tbody></table>';

  if(diasConDatos.length>0){
    h+='<div style="color:#ffb97a;font-size:11px;letter-spacing:2px;margin:18px 0 10px;">📋 DETALLE DIARIO — '+mesLbl+'</div>';
    h+='<div style="overflow-x:auto;"><table class="bt" style="min-width:auto;"><thead><tr><th style="text-align:left;min-width:60px;">FECHA</th>';
    AGENTS.forEach(function(ag){ h+='<th colspan="3">'+ag.lb+'</th>'; });
    h+='</tr><tr><th></th>';
    AGENTS.forEach(function(){ SHIFTS.forEach(function(sh){ h+='<th style="font-size:9px;padding:3px;"><span class="bdg bdg-'+sh.k+'">'+sh.k+'</span></th>'; }); });
    h+='</tr></thead><tbody>';
    diasConDatos.forEach(function(x){
      h+='<tr><td style="color:#FFD600;font-size:11px;font-weight:700;text-align:center;">'+(x.d<10?'0':'')+x.d+'/'+mm+'</td>';
      AGENTS.forEach(function(ag){ SHIFTS.forEach(function(sh){
        var v=allData[x.dk]&&allData[x.dk][ag.id]&&allData[x.dk][ag.id][sh.k];
        h+=v&&v!=='0'?'<td style="color:#FF8C00;font-family:monospace;">'+parseFloat(v).toFixed(1)+'%</td>':'<td style="color:#2a1200;">—</td>';
      }); });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  } else {
    h+='<div class="emptymsg">Sin bonificaciones cargadas en '+mesLbl+'.</div>';
  }
  document.getElementById('cWrap').innerHTML=h;
  stM(diasConDatos.length+' días cargados.','st-ok');
}

function stD(m,c){ var e=document.getElementById('stD'); e.textContent=m; e.className='stmsg '+c; }
function stM(m,c){ var e=document.getElementById('stM'); e.textContent=m; e.className='stmsg '+c; }
</script>
</body>
</html>
