<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONIFICACIONES</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0500;font-family:Calibri,Arial,sans-serif;font-size:13px;color:#ffb97a;min-height:100vh;padding:16px;}

.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  background:linear-gradient(135deg,#5a1a00 0%,#9c3d00 100%);
  color:#fff;padding:12px 20px;border-radius:8px 8px 0 0;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.top-bar .title{font-size:17px;font-weight:700;letter-spacing:2px;white-space:nowrap;color:#FFD600;}

.mode-tabs{display:flex;gap:8px;}
.tab-btn{background:#2a1000;border:1px solid #7a2900;color:#aaa;border-radius:6px;
  padding:7px 20px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;}
.tab-btn.active{background:#9c3d00;color:#FFD600;border-color:#FFD600;}

.controls-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#1a0800;padding:10px 16px;border:1px solid #5a2a00;border-top:none;}
.controls-bar label{color:#ffb97a;font-size:11px;letter-spacing:1px;font-weight:700;}
.controls-bar input[type=date],
.controls-bar input[type=month]{background:#0a0500;border:1px solid #7a2900;color:#FFD600;
  border-radius:5px;padding:4px 10px;font-size:13px;font-weight:700;outline:none;}
.controls-bar input:focus{border-color:#FFD600;}
.btn-ver{background:linear-gradient(135deg,#9c3d00,#5a1a00);border:none;color:#FFD600;
  border-radius:5px;padding:7px 18px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;}
.btn-ver:hover{filter:brightness(1.2);}
.btn-save{background:linear-gradient(135deg,#1d6b34,#0d3a1e);border:none;color:#80FFB0;
  border-radius:5px;padding:7px 18px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;}
.btn-save:hover{filter:brightness(1.2);}
.status-msg{font-size:11px;letter-spacing:1px;padding:3px 10px;border-radius:4px;}
.status-saved{color:#80FFB0;}
.status-unsaved{color:#FFB347;}
.status-info{color:#888;}

.content-wrap{background:#120800;border:1px solid #5a2a00;border-top:none;
  border-radius:0 0 8px 8px;padding:16px;overflow-x:auto;min-height:200px;}

/* Tabla diaria */
table.bonif-table{width:100%;border-collapse:collapse;min-width:500px;}
.bonif-table th{background:#2a1000;color:#ffb97a;font-size:10px;letter-spacing:1px;
  padding:9px 12px;text-align:center;border:1px solid #5a2a00;text-transform:uppercase;}
.bonif-table th.th-agent{text-align:left;min-width:140px;}
.bonif-table td{padding:6px 8px;text-align:center;border:1px solid #2a1000;vertical-align:middle;}
.bonif-table tr:nth-child(odd) td{background:#1a0800;}
.bonif-table tr:nth-child(even) td{background:#220d00;}
.bonif-table tr:hover td{background:#2e1400;}
.td-agent{color:#FFD600;font-weight:700;font-size:13px;letter-spacing:1px;text-align:left;padding-left:12px !important;}

input.bonif-pct{width:75px;background:#0a0300;border:1px solid #5a2a00;color:#FFD600;
  text-align:center;font-size:15px;font-weight:700;border-radius:4px;padding:4px 5px;
  font-family:'Courier New',monospace;outline:none;transition:border-color .15s;}
input.bonif-pct:focus{border-color:#FFD600;background:#150800;}
input.bonif-pct::placeholder{color:#3a1a00;font-size:11px;}

.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;}
.badge-TM{background:#1a3a6b;color:#7aa8ff;}
.badge-TT{background:#3a2800;color:#FFD600;}
.badge-TN{background:#2a0d3a;color:#cc88ff;}

/* Tabla mensual */
table.mensual-table{width:100%;border-collapse:collapse;min-width:600px;}
.mensual-table th{background:#2a1000;color:#ffb97a;font-size:10px;letter-spacing:1px;
  padding:9px 12px;text-align:center;border:1px solid #5a2a00;text-transform:uppercase;}
.mensual-table th.th-agent{text-align:left;min-width:140px;}
.mensual-table td{padding:7px 12px;text-align:center;border:1px solid #2a1000;font-size:12px;vertical-align:middle;}
.mensual-table tr:nth-child(odd) td{background:#1a0800;}
.mensual-table tr:nth-child(even) td{background:#220d00;}
.mensual-table tr:hover td{background:#2e1400;}
.mensual-table .td-agent{color:#FFD600;font-weight:700;font-size:13px;letter-spacing:1px;text-align:left;padding-left:12px !important;}
.pct-val{color:#FFD600;font-weight:700;font-family:'Courier New',monospace;font-size:13px;}
.pct-zero{color:#3a2000;}
.pct-dias{color:#888;font-size:11px;}
.pct-prom{color:#FF8C00;font-weight:700;font-family:'Courier New',monospace;font-size:14px;}
.pct-prom-zero{color:#3a2000;}
.total-row td{background:linear-gradient(135deg,#5a1a00,#9c3d00) !important;
  color:#fff;font-weight:700;border:1px solid #FFD600 !important;}
.total-row .pct-prom{color:#FFD600;}

.sec-title{color:#ffb97a;font-size:11px;letter-spacing:2px;margin:18px 0 10px;font-weight:700;}
.empty-msg{color:#3a2000;text-align:center;padding:30px;font-size:13px;letter-spacing:1px;}

/* Detalle diario en mensual */
.detalle-scroll{overflow-x:auto;margin-top:14px;}
table.detalle-table{border-collapse:collapse;font-size:11px;}
.detalle-table th{background:#1a0800;color:#7a4a00;font-size:9px;letter-spacing:1px;
  padding:5px 8px;text-align:center;border:1px solid #3a1a00;text-transform:uppercase;white-space:nowrap;}
.detalle-table td{padding:4px 7px;text-align:center;border:1px solid #1a0800;white-space:nowrap;}
.detalle-table tr:nth-child(odd) td{background:#120800;}
.detalle-table tr:nth-child(even) td{background:#1a0d00;}
.dt-fecha{color:#FFD600;font-weight:700;font-size:11px;}
.dt-val{color:#FF8C00;font-family:'Courier New',monospace;}
.dt-zero{color:#2a1200;}
.dt-ag-header{background:#2a1000 !important;color:#ffb97a !important;font-weight:700 !important;
  font-size:10px !important;letter-spacing:1px !important;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">🎯 BONIFICACIONES POR TURNO Y AGENTE</div>
  <div class="mode-tabs">
    <button class="tab-btn active" id="btnDiaria" onclick="setMode('diaria')">📅 DIARIA</button>
    <button class="tab-btn" id="btnMensual" onclick="setMode('mensual')">📆 MENSUAL</button>
  </div>
</div>

<div class="controls-bar" id="ctrlDiaria">
  <label>FECHA</label>
  <input type="date" id="inputFecha">
  <button class="btn-ver" onclick="cargarDiaria()">🔍 VER</button>
  <button class="btn-save" id="btnGuardar" onclick="guardar()" style="display:none;">💾 GUARDAR</button>
  <span class="status-msg status-info" id="statusMsg"></span>
</div>
<div class="controls-bar" id="ctrlMensual" style="display:none;">
  <label>MES</label>
  <input type="month" id="inputMes">
  <button class="btn-ver" onclick="cargarMensual()">🔍 VER</button>
  <span class="status-msg status-info" id="statusMsgM"></span>
</div>

<div class="content-wrap" id="contentWrap">
  <div class="empty-msg">Seleccioná una fecha o mes y presioná VER.</div>
</div>

<script>
const AGENTS = [
  {id:'AGE18',       label:'AGE 18'},
  {id:'AGE19',       label:'AGE 19'},
  {id:'AGE21',       label:'AGE 21'},
  {id:'AGE22',       label:'AGE 22'},
  {id:'AGE23',       label:'AGE 23'},
  {id:'AGE24',       label:'AGE 24'},
  {id:'AGE25',       label:'AGE 25'},
  {id:'SIEMPREMONO', label:'SIEMPRE MONO'},
];
const SHIFTS = [
  {key:'TM', label:'MAÑANA'},
  {key:'TT', label:'TARDE'},
  {key:'TN', label:'NOCHE'},
];
const STORE = 'bonificaciones_data';

let currentMode = 'diaria';

function getAllBonif(){ try{ const r=localStorage.getItem(STORE); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveAllBonif(d){ try{ localStorage.setItem(STORE,JSON.stringify(d)); }catch(e){} }

function setMode(m){
  currentMode = m;
  document.getElementById('btnDiaria').classList.toggle('active', m==='diaria');
  document.getElementById('btnMensual').classList.toggle('active', m==='mensual');
  document.getElementById('ctrlDiaria').style.display = m==='diaria'?'flex':'none';
  document.getElementById('ctrlMensual').style.display = m==='mensual'?'flex':'none';
  document.getElementById('contentWrap').innerHTML = '<div class="empty-msg">Seleccioná una fecha o mes y presioná VER.</div>';
}

function setStatus(msg, type, mensual){
  const id = mensual ? 'statusMsgM' : 'statusMsg';
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status-msg ' + (type==='ok'?'status-saved':type==='warn'?'status-unsaved':'status-info');
}

// ── MODO DIARIO ──
function cargarDiaria(){
  const dk = document.getElementById('inputFecha').value;
  if(!dk){ setStatus('Seleccioná una fecha.','info'); return; }
  const data = getAllBonif()[dk] || {};
  document.getElementById('btnGuardar').style.display = '';
  setStatus('','info');

  const [yy,mm,dd] = dk.split('-');
  const dias = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const fechaObj = new Date(dk+'T12:00:00');
  const diaLbl = dias[fechaObj.getDay()];

  let html = `<div class="sec-title">📅 ${diaLbl} ${dd}/${mm}/${yy}</div>`;
  html += `<table class="bonif-table">
    <thead><tr>
      <th class="th-agent">AGENTE</th>
      <th><span class="badge badge-TM">TM</span> MAÑANA</th>
      <th><span class="badge badge-TT">TT</span> TARDE</th>
      <th><span class="badge badge-TN">TN</span> NOCHE</th>
    </tr></thead><tbody>`;

  AGENTS.forEach(ag=>{
    html += `<tr><td class="td-agent">${ag.label}</td>`;
    SHIFTS.forEach(sh=>{
      const v = data[ag.id]?.[sh.key] || '';
      html += `<td><input class="bonif-pct" type="number" min="0" max="100" step="0.5"
        placeholder="%" value="${v}"
        data-ag="${ag.id}" data-sh="${sh.key}" data-dk="${dk}"
        oninput="onInput()"></td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table>
  <div style="color:#3a2000;font-size:10px;margin-top:10px;letter-spacing:1px;">* Ingresá el % de bonificación por turno. Ejemplo: 10 = 10%</div>`;
  document.getElementById('contentWrap').innerHTML = html;
}

function onInput(){
  setStatus('⚠ Cambios sin guardar','warn');
}

function guardar(){
  const inputs = document.querySelectorAll('#contentWrap input.bonif-pct');
  const all = getAllBonif();
  inputs.forEach(el=>{
    const {dk, ag, sh} = el.dataset;
    const val = el.value.trim();
    if(!all[dk]) all[dk]={};
    if(!all[dk][ag]) all[dk][ag]={};
    if(val==='' || val==='0'){ delete all[dk][ag][sh]; }
    else all[dk][ag][sh] = val;
    if(all[dk][ag] && Object.keys(all[dk][ag]).length===0) delete all[dk][ag];
    if(all[dk] && Object.keys(all[dk]).length===0) delete all[dk];
  });
  saveAllBonif(all);
  setStatus('✅ Guardado correctamente','ok');
}

// ── MODO MENSUAL ──
function cargarMensual(){
  const mes = document.getElementById('inputMes').value;
  if(!mes){ setStatus('Seleccioná un mes.','info',true); return; }
  const all = getAllBonif();
  const [yy,mm] = mes.split('-');
  const diasEnMes = new Date(parseInt(yy), parseInt(mm), 0).getDate();
  const meses=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const mesLbl = `${meses[parseInt(mm)-1]} ${yy}`;

  // Calcular promedios por agente/turno
  const totals = {}; const counts = {};
  AGENTS.forEach(ag=>{ totals[ag.id]={}; counts[ag.id]={}; SHIFTS.forEach(sh=>{ totals[ag.id][sh.key]=0; counts[ag.id][sh.key]=0; }); });

  const diasConDatos = [];
  for(let d=1;d<=diasEnMes;d++){
    const dk=`${yy}-${mm}-${String(d).padStart(2,'0')}`;
    if(all[dk]){
      diasConDatos.push({dk,d});
      AGENTS.forEach(ag=>{
        SHIFTS.forEach(sh=>{
          const v = all[dk][ag.id]?.[sh.key];
          if(v!==undefined && v!==''){
            totals[ag.id][sh.key] += parseFloat(v)||0;
            counts[ag.id][sh.key]++;
          }
        });
      });
    }
  }

  let html = `<div class="sec-title">📆 RESUMEN — ${mesLbl}</div>`;
  html += `<table class="mensual-table">
    <thead><tr>
      <th class="th-agent">AGENTE</th>
      <th><span class="badge badge-TM">TM</span> PROM.</th>
      <th><span class="badge badge-TT">TT</span> PROM.</th>
      <th><span class="badge badge-TN">TN</span> PROM.</th>
      <th>DÍAS</th>
      <th>PROM. GRAL.</th>
    </tr></thead><tbody>`;

  let totalProm = 0, totalCount = 0;
  AGENTS.forEach(ag=>{
    const proms = {};
    let agSum=0, agCnt=0;
    SHIFTS.forEach(sh=>{
      proms[sh.key] = counts[ag.id][sh.key]>0 ? totals[ag.id][sh.key]/counts[ag.id][sh.key] : null;
      if(proms[sh.key]!==null){ agSum+=totals[ag.id][sh.key]; agCnt+=counts[ag.id][sh.key]; }
    });
    const dias = Math.max(...SHIFTS.map(sh=>counts[ag.id][sh.key]));
    const promGral = agCnt>0 ? agSum/agCnt : null;
    if(promGral!==null){ totalProm+=agSum; totalCount+=agCnt; }

    html += `<tr><td class="td-agent">${ag.label}</td>`;
    SHIFTS.forEach(sh=>{
      if(proms[sh.key]===null) html+=`<td class="pct-zero">—</td>`;
      else html+=`<td class="pct-val">${proms[sh.key].toFixed(1)}%</td>`;
    });
    html += `<td class="pct-dias">${dias>0?dias:'—'}</td>
      <td class="${promGral!==null?'pct-prom':'pct-prom-zero'}">${promGral!==null?promGral.toFixed(1)+'%':'—'}</td>
    </tr>`;
  });

  // Fila total
  const promTotal = totalCount>0 ? totalProm/totalCount : null;
  html += `<tr class="total-row">
    <td style="color:#FFD600;padding-left:12px;letter-spacing:1px;">PROMEDIO GENERAL</td>
    <td colspan="3"></td>
    <td class="pct-dias">${diasConDatos.length} días</td>
    <td class="${promTotal!==null?'pct-prom':'pct-prom-zero'}">${promTotal!==null?promTotal.toFixed(1)+'%':'—'}</td>
  </tr>`;
  html += `</tbody></table>`;

  // Detalle día a día
  if(diasConDatos.length>0){
    html += `<div class="sec-title" style="margin-top:22px;">📋 DETALLE DIARIO — ${mesLbl}</div>`;
    html += `<div class="detalle-scroll"><table class="detalle-table"><thead><tr>
      <th class="dt-fecha">FECHA</th>`;
    AGENTS.forEach(ag=>{
      html += `<th colspan="3" class="dt-ag-header">${ag.label}</th>`;
    });
    html += `</tr><tr><th></th>`;
    AGENTS.forEach(()=>{
      SHIFTS.forEach(sh=>{
        html += `<th><span class="badge badge-${sh.key}" style="font-size:9px;">${sh.key}</span></th>`;
      });
    });
    html += `</tr></thead><tbody>`;

    diasConDatos.forEach(({dk,d})=>{
      const dayData = all[dk]||{};
      html += `<tr><td class="dt-fecha">${String(d).padStart(2,'0')}/${mm}</td>`;
      AGENTS.forEach(ag=>{
        SHIFTS.forEach(sh=>{
          const v = dayData[ag.id]?.[sh.key];
          if(v && v!=='0') html+=`<td class="dt-val">${parseFloat(v).toFixed(1)}%</td>`;
          else html+=`<td class="dt-zero">—</td>`;
        });
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  } else {
    html += `<div class="empty-msg">Sin bonificaciones cargadas en ${mesLbl}.</div>`;
  }

  document.getElementById('contentWrap').innerHTML = html;
  setStatus(`${diasConDatos.length} días con datos en ${mesLbl}.`, 'info', true);
}

// Init
window.addEventListener('load', ()=>{
  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('inputFecha').value = hoy;
  document.getElementById('inputMes').value = hoy.slice(0,7);
});
</script>
</body>
</html>
